    <script>
      (function () {
        try {
          var ids = ['pink', 'ocean', 'forest', 'sunset', 'sand', 'silver', 'galaxy', 'midnight', 'emerald', 'ember', 'graphite'];
          var d = JSON.parse(localStorage.getItem('stardesk:v2') || 'null');
          var t = d && d.settings && d.settings.theme;
          if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'galaxy';
          t = ids.indexOf(t) > -1 ? t : 'pink';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is Stardesk free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Stardesk is completely free and needs no account or sign-up."
                }
              },
              {
                "@type": "Question",
                "name": "Where is my planner data stored?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Everything you enter is stored locally in your own browser. Nothing is uploaded to a server, and you can export or import a backup file from Settings. The cycle tracker and time capsules never leave your device."
                }
              },
              {
                "@type": "Question",
                "name": "How do reminders work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Add a reminder to any event. While Stardesk is open in a tab you get an in-app alert, a sound and, if you allow it, a browser notification."
                }
              },
              {
                "@type": "Question",
                "name": "Can I use Stardesk on my phone?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The layout is fully responsive and you can install it to your home screen as an app."
                }
              },
              {
                "@type": "Question",
                "name": "Does Stardesk show prayer times and the Hijri date?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Prayer times are calculated on your device from your city, calculation method and madhab, so they keep working offline. The Hijri date can be shifted by a day to match moon sighting in your country."
                }
              },
              {
                "@type": "Question",
                "name": "Does it work offline?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Stardesk installs as an app and keeps working without internet. Only the live weather widget needs a connection; it shows the last forecast when you are offline."
                }
              },
              {
                "@type": "Question",
                "name": "How do I move my data to another phone or computer?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Open Settings, tap Export backup, then open Stardesk on the other device and choose Import backup. Older backups are upgraded automatically."
                }
              },
              {
                "@type": "Question",
                "name": "What data does the weather widget send out?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Only the latitude and longitude of the city you choose are sent to the free Open-Meteo weather service to fetch the forecast. Your planner data is never sent."
                }
              }
            ]
          }
